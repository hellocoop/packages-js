name: Release

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm test --workspace=httpsig
            - run: npm test --workspace=better-auth
            - run: npm test --workspace=email-verification

    publish:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'
            - run: npm ci
            - run: npm run build
            - name: Publish packages with provenance
              run: |
                  # The loop runs in a subshell because it is fed by a pipe, so
                  # failures are recorded in a file rather than a variable.
                  failed=$(mktemp)
                  npx lerna ls --json --no-private | jq -r '.[] | "\(.name) \(.version) \(.location)"' | while read name version location; do
                    # Compare against this exact version, not the latest dist-tag.
                    # A prerelease is never the latest, so comparing against it
                    # would republish an already-published prerelease on a re-run.
                    if npm view "$name@$version" version >/dev/null 2>&1; then
                      echo "Skipping $name@$version (already published)"
                      continue
                    fi

                    # A prerelease goes under a dist-tag named for its preid, so
                    # it never becomes the default install: 2.0.0-alpha.1 -> alpha,
                    # 1.8.0-next.3 -> next. A plain version goes to latest.
                    case "$version" in
                      *-*)
                        tag=$(printf '%s' "${version#*-}" | sed 's/[.+].*//')
                        [ -n "$tag" ] || tag=next
                        ;;
                      *)
                        tag=latest
                        ;;
                    esac

                    echo "Publishing $name@$version under dist-tag '$tag'..."
                    if (cd "$location" && npm publish --provenance --access public --tag "$tag"); then
                      echo "✅ Published $name@$version ($tag)"
                    else
                      echo "❌ Failed to publish $name@$version"
                      echo "$name@$version" >> "$failed"
                    fi
                  done

                  if [ -s "$failed" ]; then
                    echo "::error::Failed to publish: $(tr '\n' ' ' < "$failed")"
                    exit 1
                  fi
